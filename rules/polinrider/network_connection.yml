title: PolinRider Worm - C2 Server IP Connection
id: 21c04e54-401e-46fe-9b6f-4021f0f773a6
status: experimental
description: |
    Detects network connections to rented VPS/hosting IPs used as PolinRider
    worm C2 servers (DPRK-linked, unconfirmed attribution per OpenSourceMalware/
    Socket). Addresses rotate roughly every 1-3 weeks - a match is a dated lead,
    not a permanent blocklist entry. Current server as of Nov 25, 2026 is
    95.135.181.84.
references:
    - https://threatdefence.com/article/polinrider-north-korea-github-npm-malware-hunting
    - https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits
author: MILO
