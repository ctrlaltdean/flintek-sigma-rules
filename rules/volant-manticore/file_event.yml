title: Volant Manticore KuboShell and Homa Framework Dropped Files
id: 841da673-ce40-4cae-8176-811ec040f15d
status: experimental
description: >
  Detects file creation of lure documents, phishing archives, and KuboShell
  registration/output artifacts associated with Volant Manticore's espionage
  campaigns against Cyprus and Saudi Arabia targets.
references:
  - https://research.checkpoint.com/2026/volant-manticore-flying-under-the-radar/
  - https://thehackernews.com/2026/11/iran-aligned-volant-manticore-uses-ipfs.html
author: MILO
date: 2026-11-24
tags:
  - attack.initial-access
  - attack.t1566.001
  - attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_lures:
    TargetFilename|endswith:
      - '\MilitaryHeritageProposal.doc'
      - '\AI_Healthcare_Seminar.zip'
      - '\Ai_Healthcare_Seminar_Online.zip'
      - '\Install-Remotely.ps1'
  selection_kuboshell_artifacts:
    TargetFilename|cased:
      - 'C:\Users\Public.log'
      - 'C:\Users\Publicre.txt'
  condition: selection_lures or selection_kuboshell_artifacts
falsepositives:
  - Lure filenames are distinctive and unlikely to recur legitimately; the C:\Users\Public*.log/.txt artifacts are more generic Windows paths, so weight them lower in isolation and corroborate with the network_connection or proxy rules in this folder.
level: medium
