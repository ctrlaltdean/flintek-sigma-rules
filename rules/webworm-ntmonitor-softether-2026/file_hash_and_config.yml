title: Webworm NtMonitor SoftEther Bridge - Known Hashes and Config Artifact
id: f2a6f308-19df-467f-8339-da5307a94154
status: experimental
description: |
    Detects the one publicly known Webworm-attributed modified SoftEther VPN
    Bridge sample (netcapa.exe) and its associated encrypted configuration
    files by SHA-256, plus file-event matches on the renamed configuration
    filename pattern (setting.conf / @setting.conf). Note: this rule matches
    on filename only - it does NOT inspect file content, so it cannot verify
    the RCEN magic-byte prefix described in the vault note; that requires a
    content-aware EDR/YARA capability, not standard file_event telemetry.
references:
    - https://www.rapid7.com/blog/post/tr-spying-on-governments-no-malware-custom-webworms-toolkit-softether-bridge
    - https://thehackernews.com/2026/11/webworm-suspected-of-modifying.html
    - https://www.defenderdaily.com/stories/2026/11/webworm-rebuilt-softether-vpn-bridge
author: MILO
date: 2026-11-23
tags:
    - attack.command-and-control
    - attack.t1071
    - attack.defense-evasion
    - attack.t1027.005
logsource:
    category: file_event
    product: windows
detection:
    # Every SHA-256 below is exactly 64 hex chars - verified by hand, not eyeballed.
    selection_hash:
        Hashes|contains:
            - '90e70c0b04ecb9dfa1d5c60fe7de901846ebf0b54754ea12dde1ccb77623a6e8'
            - '4532584e9c35e03bcaa97d475eefc373d0aa9baf6a628776b4acef23cd10f222'
            - 'b12d5e345b013d363d13340f9423503d89180e0fd5d9f48fc50bd89d2276e6f7'
    selection_config_name:
        TargetFilename|endswith:
            - '\setting.conf'
            - '\@setting.conf'
    condition: selection_hash or selection_config_name
falsepositives:
    - selection_config_name alone may match unrelated software using similarly named config files - the hash-based selection_hash entries are attacker-exclusive and should be weighted higher; combine with RCEN magic-byte content inspection where the EDR supports file content matching
level: critical
