title: OPTIMJACK Optimizely Supply Chain - Malicious Domain DNS Query
id: 7a1e2b3c-9f10-4e2a-8b3d-optimjack0001
status: experimental
description: Detects DNS queries to OPTIMJACK C2/exfil domains (1688360.cc, webshell.lol, .icu iOS-stage infra)
references:
    - https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/
author: MILO
date: 2026-11-17
tags:
    - attack.command-and-control
    - attack.t1071.004
logsource:
    category: dns
detection:
    selection:
        query|contains:
            - '1688360.cc'
            - 'webshell.lol'
            - 'linkforge.cc'
            - 'l7bcsnwc7nzr3uo.icu'
            - '5vobauua3ojpklx.icu'
            - 'p55abnw2pnsz0bo.icu'
            - 'je4ft3gn8vxudum.icu'
            - 'eil786npto9u5bq.icu'
            - '1y69gy2mdzaltz1.icu'
            - 'gm38duxoihbmy5o.icu'
            - 'q1ls1ho9x7wsxlu.icu'
            - 'ios-hack.icu'
    condition: selection
falsepositives:
    - None expected - these are attacker-registered domains
level: critical
