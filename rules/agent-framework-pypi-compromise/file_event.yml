title: Microsoft agent-framework PyPI Compromise - Malicious Package File Hash Match
id: ad8326a2-8a99-4fde-91b1-98a7ea12fdd9
status: experimental
description: |
    Detects files matching known-malicious artifacts from the Nov 17, 2026 compromise
    of Microsoft's official `agent-framework` package on PyPI. Versions 1.26.1 and
    1.26.2 (both since removed from PyPI) shipped a credential stealer that runs on
    every Python interpreter start via a .pth hook, targeting Azure, Azure DevOps,
    and GitHub Actions OIDC credentials. 1.26.1 used agent_framework_meta.pth /
    agent_framework_meta/__init__.py / agent_framework_meta/_telemetry.py; 1.26.2
    moved the same mechanism to af_runtime_diag.pth / af_runtime_diag.py. The last
    known-good release is 1.26.0.
references:
    - https://safedep.io/blog/microsoft-agent-framework-pypi-compromise
    - https://www.aikido.dev/blog/two-malicious-agent-framework-releases-hit-pypi-in-33-minutes
    - https://www.ox.security/blog/breaking-hijacked-releases-of-microsofts-official-agent-framework-steals-azure-and-ci-credentials/
author: MILO
date: 2026-11-18
tags:
    - attack.initial-access
    - attack.t1195.001
    - attack.credential-access
    - attack.t1552.001
    - attack.persistence
    - attack.t1546
logsource:
    category: file_event
detection:
    # Every hash below is verified exactly 64 hex characters against safedep.io and
    # aikido.dev independently (both corroborate the identical hash set). Do not
    # truncate/pad if re-transcribing elsewhere - recount instead.
    selection:
        Hashes|contains:
            - 'd27fa34414e6201d5e03e559ef634f020057554d7b3f4898dd5d7cd3e989e110'
            - '21f28e8517a10ffe431f8d68f5875c85eca4001ae6d118322b0a41873998eb5e'
            - 'c275ccbe520ef3c0f02dc6a35389e427f9f1b4e0b12e140cd7bf7179ce143f02'
            - '39fa329f2a93f734b0bb8f5adb203ea3331d1ae479832a5015a54cb17aabd663'
            - '3d20a8bc91351a9a16b6db243b848ceca0206b7a8623b02d2af553a9c9f7e0a9'
            - '325e7e9f0ec94e41ad1a1b7a3f18a6b8b5bffece2e2b97b8d3369eb967452f93'
            - '54d885b7d7161c9ed96489c66364c4bfbf635929166843bba10d97d46b5a2e1f'
    condition: selection
falsepositives:
    - None expected - these hashes match only the attacker's injected files/wheels, never legitimate agent-framework releases
level: critical
