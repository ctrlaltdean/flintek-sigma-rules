title: BubbleLoader Trojanized Host Binary - File Hash Match
id: f2c5e0be-ef69-4a1b-b28e-28672bbfaae5
status: experimental
description: |
    Detects known BubbleLoader tampered-carrier binaries by SHA-256 on disk. BubbleLoader
    patches a legitimate signed host executable's entry point and appends two PNG images
    (one a real gradient image used as a rolling XOR key, the other a malformed PNG hiding
    XOR-encrypted shellcode) to convert benign software into a payload delivery mechanism.
    Documented hosts include WinRAR, x64dbg, Windows Media Player, Firefox Launcher, and
    virtiofs. Only the on-disk tampered carrier hash is stable - BubbleLoader's anti-forensics
    loop rewrites compiler padding with CPU-timestamp-derived randomness so the in-memory
    unpacked payload hash differs on every execution; this rule targets the carrier file only.
references:
    - https://www.reversinglabs.com/blog/threat-researchers-notebook-bubbleloader
    - https://kyberkit.com/en/articles/bubbleloader-trojanized-winrar-png-loader
author: MILO
date: 2026-11-18
tags:
    - attack.defense-evasion
    - attack.t1554
    - attack.t1027.003
    - attack.t1027.009
logsource:
    category: file_event
