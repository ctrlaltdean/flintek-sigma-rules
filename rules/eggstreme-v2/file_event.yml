title: EggStreme v2 - Known Malicious File Hash (MD5)
id: fea63d37-1310-4859-9aff-a99d77d72469
status: experimental
description: |
    Detects known EggStremeLoader/EggStremeFuel/EggStremeAgent component and
    configuration file hashes on disk, from Bitdefender's November 2026
    EggStreme rebuild report. Source CSV uses MD5 only; no SHA-256 was
    published for these samples at research time.
references:
    - https://www.bitdefender.com/en-us/blog/businessinsights/eggstreme-malware-revises-architecture-infrastructure
    - https://github.com/bitdefender/malware-ioc/blob/master/2026_11-eggstreme-iocs.csv
author: MILO
date: 2026-11-18
tags:
    - attack.defense-evasion
    - attack.t1574.002
    - attack.persistence
logsource:
    category: file_event
detection:
