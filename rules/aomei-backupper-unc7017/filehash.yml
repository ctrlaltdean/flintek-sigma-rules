title: AOMEI Backupper Supply Chain (UNC7017) - Known CROSSROAD/SHINYROAD/ADAPTAGENT File Hashes
id: f5f3eab8-8c2f-40c1-b99c-5dc6651de201
status: experimental
description: |
    Detects known-bad files from the AOMEI Backupper update-server tampering campaign:
    the CROSSROAD downloader (upgrade-now.exe / upgrade-now.zip), the SHINYROAD backdoor
    loader DLL and payload archive, and the ADAPTAGENT (Adaptix C2) launcher used for
    post-exploitation in July 2026. One hash (ADAPTAGENT launcher, NitroPromotion.exe) is
    directly confirmed in Google/Mandiant's own published YARA rule reference value; the
    remainder are drawn from independent third-party IOC compilations of the GTIG/Mandiant
    and ManageEngine reports and were not independently re-verified against the vendors'
    (paywalled) VirusTotal IOC collection - treat as reported, not independently confirmed,
    and re-validate hashes before relying on them for blocking.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering
    - https://www.manageengine.com/threat-analysis-lab/aomei-backupper-supply-chain-compromise.html
    - https://slapopotamus.github.io/HuntPack/hunts/AOMEI-Backupper-UNC7017-ShinyRoad-Hunt.html
author: Vance
date: 2026-11-18
tags:
    - attack.resource-development
    - attack.t1588.001
    - attack.execution
    - attack.t1204
logsource:
    category: file_event
    product: windows
    definition: Requires hash-enriched file events with SHA-256 values mapped to Hashes; standard Sysmon Event ID 11 does not provide file hashes.
