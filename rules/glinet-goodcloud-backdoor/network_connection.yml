title: GL.iNet GoodCloud Backdoor - C2/Reverse Shell Network Connection
id: d882bc09-858c-4096-a2de-51c2ad458af3
status: experimental
description: Detects outbound connections to C2/reverse-shell infrastructure used in the November 2026 GL.iNet GoodCloud cloud compromise that pushed malware to customer routers and KVM devices
references:
    - https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/
    - https://www.gl-inet.com/blogs/blog/glinet-security-notice-2026-11-20
    - https://github.com/RemoteToHome-io/gl-security-incident-2026
    - https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056/79
author: MILO
date: 2026-11-23
tags:
    - attack.command-and-control
    - attack.t1071
logsource:
    category: network_connection
detection:
    selection_exact_ips:
        DestinationIp:
            - '170.39.226.219'
            - '66.245.219.252'
            - '65.20.71.131'
    # 170.39.226.219 is one observed address in a /24 that RemoteToHome flagged
    # as worth watching more broadly - kept as a separate, lower-confidence
    # selection so the exact-IP hits above stay 'critical' on their own.
    selection_cidr_range:
        DestinationIp|cidr: '170.39.226.0/24'
    condition: selection_exact_ips or selection_cidr_range
falsepositives:
    - None expected for the exact IPs/ports - these are attacker-controlled hosts specific to this campaign
    - The 170.39.226.0/24 range match is broader than the confirmed single IP; validate against other context (device type, GoodCloud enrollment) before treating a /24 hit alone as confirmed compromise
level: critical
