title: cPGuard OpsShield Update Hijack - Malicious Update Script Hash Match
id: e3c1fd1a-4a59-4147-884b-122776525844
status: experimental
description: |
    Detects the four known SHA-256 hashes of cpguard-v58812-i91511*.sh, the
    malicious script served through OpsShield's hijacked cPGuard autoupdate
    channel on 2026-11-02. The script ran as root on checked-in cPGuard
    5.88.12-5.88.19 agents, collected /etc/shadow, /etc/passwd, root SSH
    material, MySQL root credentials and shell history, staged it for
    exfiltration, and dropped a hidden setuid-root backdoor shell.
references:
    - https://opsshield.com/notice/cpguard-update-channel-compromise.html
    - https://opsshield.com/notice/security-incident-disclosure-servermanage.html
    - https://www.securityweek.com/malicious-cpguard-updates-served-in-opsshield-supply-chain-attack/
    - https://www.bleepingcomputer.com/news/security/hackers-hijack-cpguard-autoupdate-to-deploy-backdoor-steal-data/
    - https://thehackernews.com/2026/11/cpguard-update-channel-hijacked-to.html
author: Vance
date: 2026-11-18
tags:
    - attack.initial-access
    - attack.t1195.002
    - attack.execution
    - attack.t1059.004
    - attack.credential-access
    - attack.t1003.008
logsource:
    category: file_event
    product: linux
    definition: Requires Linux file telemetry enriched with SHA-256 hashes mapped to Hashes; ordinary file creation events without hashes cannot match this rule.
detection:
    selection:
        Hashes|contains:
            - '2c2acd988da531d133d0e17f245c49bf15781278f837543d18c95e8410eabd38'
            - 'ffd7a47f65fa1244429baa936ae94be54676b53d2f88bc39564f24e22011de8a'
            - 'd73919af84bf46de941db85e27fd1abc65701ef9ce6cf33bb27c5397f4a41c26'
            - '6add0201e9a3d02de772d561d05e0da86eb1c538686753b7adcc3aedf7366f77'
    condition: selection
falsepositives:
    - None expected - these are attacker-authored, incident-specific script hashes
level: critical
