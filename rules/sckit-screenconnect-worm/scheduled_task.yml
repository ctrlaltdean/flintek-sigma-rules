title: SCKit ScreenConnect Worm - TrapWatch Scheduled Task Creation
id: 2aae0e56-8861-477c-8fbd-db0c9d61ae39
status: experimental
description: >
  Detects creation of the "TrapWatch" scheduled task used by the Nov 2026
  SCKit ScreenConnect worm for persistence.
references:
  - https://huntress.com/blog/sckit-worm-rogue-screenconnect
author: MILO
date: 2026-11-17
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: 'TrapWatch'
    Image|endswith: '\schtasks.exe'
  condition: selection
falsepositives:
  - None expected - TrapWatch is a campaign-specific scheduled task name.
level: high
