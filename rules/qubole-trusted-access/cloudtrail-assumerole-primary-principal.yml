title: Qubole Trusted Access Attack - AssumeRole by Confirmed Malicious IAM Principal
id: 8c8a4f1c-87c3-450a-8342-acfde6e9e40d
status: experimental
description: |
    Detects sts:AssumeRole calls using IAM principal ID AIDA3W7DIFLYOLTK63SFS,
    an identity inside Qubole's AWS account (805246085872) that Wiz CIRT
    observed exclusively in threat-actor activity between 2026-10-14 and
    2026-10-26, with no legitimate Qubole platform traffic attributed to it
    in any monitored customer environment. Any hit on this principal in a
    Qubole integration role warrants immediate investigation.
references:
    - https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild
    - https://www.csoonline.com/article/4246780/qubole-supply-chain-attack-exposed-aws-entra-id-and-okta-credentials.html
author: Vance
date: 2026-11-18
tags:
    - attack.initial-access
    - attack.t1199
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sts.amazonaws.com
        eventName: AssumeRole
        userIdentity.principalId: AIDA3W7DIFLYOLTK63SFS
    condition: selection
falsepositives:
    - None expected - Wiz CIRT observed no legitimate activity from this principal across all monitored environments
level: critical
