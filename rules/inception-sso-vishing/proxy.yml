title: HTTP(S) Request to Inception/O-UNC-053 SSO Vishing Phishing Domains
id: 5d25a378-b141-420a-8f40-0092cf09227f
status: experimental
description: |
    Detects outbound HTTP/HTTPS requests to confirmed "Inception" extortion
    brand (O-UNC-053 / ShinyHunters-linked) phishing-kit domains observed in
    the SSO vishing campaign active since late October 2026. Victims are
    phoned by attackers posing as IT support and walked to one of these
    legal-themed lookalike domains, which serve a filtered phishing kit that
    mimics the target's Okta or NetIQ/OpenText Access Manager sign-in page.
references:
    - https://www.reversinglabs.com/blog/threat-researchers-notebook-sso-vishing-campaign-associated-with-emerging-inception-extortion-group
    - https://www.bleepingcomputer.com/news/security/new-inception-extortion-gang-launches-large-scale-vishing-campaign
    - https://www.infosecurity-magazine.com/news/inception-extortion-sso-vishing
author: MILO
date: 2026-11-25
tags:
    - attack.initial-access
    - attack.t1566.004
    - attack.credential-access
    - attack.t1621
logsource:
    category: proxy
detection:
    selection:
        c-uri-host:
            - 'legal-duolingo.com'
            - 'activisionblizzard-legal.com'
            - 'legal-morningstar.com'
            - 'legal-westernunion.com'
            - 'legal-ea.com'
            - 'legal-dropbox.com'
            - 'legal-riotgames.com'
            - 'legal-indeed.com'
            - 'legal-creditkarma.com'
            - 'legal-vrtx.com'
            - 'legal-aexp.com'
            - 'legal-expeditors.com'
            - 'legal-twitch.tv'
            - 'legal-lvmh.com'
            - 'legal-amd.com'
            - 'legal-carvana.com'
            - 'legal-pepsico.com'
            - 'legal-caesars.com'
            - 'legal-rbi.com'
            - 'legal-grubhub.com'
            - 'legal-lucidmotors.com'
    condition: selection
falsepositives:
    - Unknown. These are attacker-registered lookalike domains with no
      legitimate purpose; any hit should be treated as a true positive.
level: high
