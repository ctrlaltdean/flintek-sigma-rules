title: LiteLLM cook/sitecustomize Supply Chain (Oct 2026) - Malicious File / Hash Match
id: a8fde143-7d1c-4e67-a76a-359b23814438
status: experimental
description: |
    Detects the three Python startup-hook files (cook.pth, cook.py,
    sitecustomize.py) injected into site-packages root by the compromised
    litellm==1.107.0 wheel (T1546.018 / T1037), RAT staging files, and known
    SHA-256 hashes for the payload files, all seven affected wheel builds, and
    the affected Docker/GHCR image digests. Hash values are cross-confirmed
    across three independent technical analyses (Microsoft, Chainguard,
    OpenSourceMalware) and verified exactly 64 hex characters each; this
    campaign's hashes are materially higher-confidence than the March 2026
    campaign's (see that campaign's file_event.yml).
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
    - https://www.chainguard.dev/fr-FR/unchained/litellm-attacked-again-malicious-1-107-0-wheels-on-pypi-and-docker-hub-october-2026
    - https://opensourcemalware.com/blog/litellm-1-107-0-pypi-wheel-contains-a-credential-stealer-and-persistent-python-backdoor
    - https://docs.litellm.ai/blog/security-incident-oct-21-2026
author: Vance (CTI)
date: 2026-11-18
tags:
    - attack.persistence
    - attack.t1546.018
    - attack.t1195.002
    - attack.credential-access
logsource:
    category: file_event
detection:
    # cook.pth / cook.py are not legitimate files anywhere - high confidence.
    selection_unique_paths:
        TargetFilename|endswith:
            - '/site-packages/cook.pth'
            - '/site-packages/cook.py'
    # sitecustomize.py is a standard Python filename that CAN be legitimate -
    # path match alone is not sufficient, see falsepositives below. Hash
    # matching is the reliable signal for this one.
    selection_sitecustomize_path_lower_confidence:
        TargetFilename|endswith: '/site-packages/sitecustomize.py'
    selection_hashes:
        Hashes|contains:
            # cook.pth / cook.py / sitecustomize.py (incl. Windows wheel variants)
            - '7f191632e7320705d154b85204f1ae546b543acbd7e8861229b76f5042b92bdb'
            - '84dc8c82c0a4a4a62552ef826b49fcc86d1a5c4a5d0f2c06665723f93d129d7d'
            - '9dd0a3926f96a37eb86cf1ee2310d9be93139cc4ebef3ef9e2efe9531390be25'
            - '03ac2a8b752605d1d7710979c17ff18b03dd978203ba23ba97fd8ce3d6f897ea'
            - '34bef04fe88ac9d0aae0475630b1738681d15b94f233ac8aa46eacf5968305fa'
            - 'b6122440d0d9cb1eb1ade9933f49214da8c31288de7710c076c2680dfa528465'
            # affected litellm-1.107.0 wheel builds (all 7 platforms)
            - '7598727f209d717041db37f7dca271d3a7d328a279890e0e1d55375729aeb86d'
            - '0aaf7ba346d41ef2f40390436738b001180d5a1c03aa093f121078a9969d9a1a'
            - '668169d35b87bf51324080390b1b1c5ab12bd335cfe5f1a99e3689abd5e02ae6'
            - '462d0c9f67ca522d9e0e4acd245e90b36ce0d5353604a66bb7c43a1ec4a6fcf7'
            - 'c2e32d0ce2548aa662c18bf5001911a79fe5b30cf8357132275add02fdcde054'
            - '1bbce8caa94f01c0aaa0b7ddae51553a8a32e1ce53d96d44fe583272aff7ad00'
            - '12d4ccc5c6f8d35cf4f2cf233b7f3e418e863e657d81ff5f5fc9e210005b9484'
    selection_image_digest:
        ImageDigest|contains:
            # Compromised multi-arch manifest index, confirmed by LiteLLM's own
            # post and Microsoft (highest confidence):
            - '1bbcb1443bc962e45f5aad53fe3d2c30600e0379715fb6c664cdd3ac126c339e'
            # Per-platform manifest digests underneath that index, Chainguard
            # only (single source, included for completeness):
            - 'bd1aeee419ea36da9aa2b657288da4101887be468f020ac63d22ba6ed84a3ea5'
            - '56b74573eed6e4aafe4b50603dbe7853e0345f188c8e44a09f1098caf1f4bcdf'
            - '24581ddc30767f16ecb69d2b0517556f2cd7dea56971adb42a3d1beb97d69523'
            - '827dd893c74cf621a860a66a3a447a5c732533f087589ce905573e285c0a239c'
            - '645a67d810628252d63df85dcc8824c58bcc77cf8383f4d3e6321f0ccc3ce9e4'
            - 'f75c8edae59b72b1ebfd617295833f465c85bb2fab9c1d60f21b496db86cb8da'
    condition: selection_unique_paths or selection_hashes or selection_image_digest or selection_sitecustomize_path_lower_confidence
falsepositives:
    - "cook.pth and cook.py: none expected, not legitimate files in any known package."
    - "sitecustomize.py (selection_sitecustomize_path_lower_confidence): this IS a standard Python mechanism and some legitimate environments ship their own. A bare path/filename hit is NOT sufficient evidence of compromise - require a hash match or co-occurrence with cook.pth before treating as this campaign."
    - "Image digests (and the wheel hashes) are exact artifact fingerprints; no false positives expected if the hash matches."
level: critical
