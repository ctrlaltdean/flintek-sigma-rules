title: SlippyNunchucks DarkVigil - C2/Staging Network Connection (Sogou Hijack)
id: edda4357-41ec-403e-86fa-697af73e1e47
status: experimental
description: |
    Detects outbound connections to IP addresses used as DNS-hijacking
    staging servers (impersonating Sogou's config.pinyin.sogou.com) or as
    DarkVigil bootstrap/C2 infrastructure in the SlippyNunchucks campaign.
