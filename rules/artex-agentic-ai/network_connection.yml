        DestinationIp:
            - '45.153.126.223'
            - '43.98.196.73'
            - '213.111.150.145'
    condition: 1 of selection_*
falsepositives:
    - Shared/rotating VPS or cloud hosting IP space could be reassigned to unrelated services over time
    - None expected for the high-confidence corroborated selections at time of writing
level: high
