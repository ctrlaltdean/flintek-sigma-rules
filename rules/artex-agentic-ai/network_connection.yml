title: ARTEX Agentic AI Campaign - C2/Server Network Connection
id: fe5789cd-df44-48b7-9ce2-002b9467b7b4
status: experimental
description: |
    Detects outbound connections to IP infrastructure reported in connection with
    the ARTEX agentic AI offensive framework across multiple distinct campaigns:
    Storm-3358 (financial-sector focus, Microsoft), the South Korea financial-sector
    campaign (CrowdStrike/Censys), and the ConnectWise-adjacent reporting. IPs for
    Storm-0940/ConnectWise specifically are already covered by the
    rules/connectwise-skykick-artex ruleset in this repo and are not duplicated here.
    IP-based indicators are explicitly called ephemeral/reassignable by the FBI; treat
    as a starting point for investigation, not a static blocklist.
references:
    - https://www.ic3.gov/CSA/2026/261113.pdf
    - https://www.darktrace.com/blog/agentic-attacks-in-the-wild-inside-three-artex-investigations
author: MILO
date: 2026-11-25
tags:
    - attack.command-and-control
    - attack.t1071
logsource:
    category: network_connection
detection:
    # High-confidence: cross-referenced by 2+ independent orgs (Microsoft/FBI + Darktrace)
    selection_storm3358_corroborated:
        DestinationIp:
            - '85.11.167.52'
    # Medium/single-primary-source: Microsoft-reported Storm-3358 infrastructure, repeated
    # by FBI FLASH but not independently observed elsewhere in this research pass.
    selection_storm3358_single_source:
        DestinationIp:
            - '199.19.95.66'
            - '199.19.95.67'
            - '199.19.95.68'
            - '91.92.240.238'
            - '85.11.168.45'
            - '178.16.54.129'
            - '31.77.229.35'
    # South Korea financial-sector campaign: ARTEX host corroborated by CrowdStrike + Censys
    selection_sk_finance_corroborated:
        DestinationIp:
            - '38.244.50.120'
    # South Korea financial-sector campaign proxy IPs: single source (CrowdStrike)
    selection_sk_finance_single_source:
        DestinationIp:
            - '101.53.80.20'
            - '205.214.59.31'
            - '124.155.252.63'
            - '154.201.79.246'
            - '23.248.249.90'
            - '23.158.220.98'
            - '103.248.148.84'
            - '203.160.133.172'
            - '209.209.85.38'
    # Single-source, Darktrace-only (Nov 18 2026 blog): BLOODALCHEMY C2 linked to
    # China-nexus espionage activity assessed moderate-confidence to VAPOR PANDA tradecraft,
    # an Azure credential-collection entry IP, and a WISP-agent download server. Not
    # independently confirmed elsewhere - validate before treating as high confidence.
