title: Shai-Hulud npm Worm - Bun Runtime Fetch/Exec from npm Install Hook
id: fd1c5954-b265-4add-b651-09c4ef4d2ea0
status: experimental
description: |
    Detects the Shai-Hulud/ChainDrop npm worm's second-stage loader behavior:
    an npm install hook (preinstall/postinstall) running setup.mjs, which
    downloads the Bun JavaScript runtime and uses it to execute an obfuscated
    payload (Math_Symbol.js / math_init.js), or the campaign's characteristic
    staging-directory and lock-file naming under /tmp.
references:
    - https://secure.software/npm/packages/file-entry-cache/malware/11.1.6
    - https://safedep.io/blog/redhat-cloud-services-hit-by-mini-shai-hulud-npm-worm
    - https://slapopotamus.github.io/HuntPack/hunts/KeyvShaiHulud-npm-Worm-Hunt.html
    - https://github.com/Cobenian/shai-hulud-detect
author: Vance
date: 2026-11-18
tags:
    - attack.execution
    - attack.t1059.007
    - attack.t1195.002
logsource:
    category: process_creation
detection:
    selection_loader_file:
        CommandLine|contains:
            - 'setup.mjs'
            - 'Math_Symbol.js'
            - 'math_init.js'
    selection_bun_download:
        CommandLine|contains:
            - 'oven-sh/bun/releases/download/bun-v1.3.13'
    selection_tmp_artifacts:
        CommandLine|contains:
            - '/tmp/bun-dl-'
            - '/tmp/kitty-'
            - 'tmp.dpkg_'
    condition: selection_loader_file or selection_bun_download or selection_tmp_artifacts
falsepositives:
    - selection_bun_download - legitimate developers/CI pipelines that
      intentionally adopt the Bun runtime will trigger this; confirm the
      parent process is an unexpected npm/pnpm/yarn install hook rather than a
      deliberate build step before escalating.
    - selection_loader_file/selection_tmp_artifacts - low; these filenames are
      campaign-specific and not standard npm tooling. Apply the same rule to
      Linux auditd/EDR process logs (translate CommandLine to the equivalent
      exec arguments field) since these worms predominantly run in Linux
      CI/build environments.
level: critical
